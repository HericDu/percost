services:
  percost:
    build:
      context: .
      dockerfile: Dockerfile
    image: percost:latest
    container_name: percost
    restart: unless-stopped
    ports:
      - "12800:5000"
    environment:
      FLASK_ENV: production
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      # 管理后台入口路径：访问 https://域名/<ADMIN_PATH> 才会显示登录页，
      # 其余路径一律返回 404。该值不会下发到前端。
      ADMIN_PATH: ${ADMIN_PATH:-login}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      TOKEN_EXPIRE_DAYS: ${TOKEN_EXPIRE_DAYS:-7}
      # 前后端同源，无需跨域放行
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:12800}
    volumes:
      - ./data:/app/data
